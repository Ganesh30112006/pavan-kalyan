name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests migrations/env.py
      - run: ruff format --check app tests migrations/env.py
      - run: mypy app tests
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Production bundle contains no demo code
        run: |
          if grep -l "createDemoApi\|demo-conn-aws" dist/assets/*.js; then
            echo "Demo service found in the production bundle" >&2
            exit 1
          fi
      - name: Production build refuses demo mode
        run: |
          if VITE_DEMO_MODE=true npx vite build --outDir /tmp/should-not-exist; then
            echo "Production build accepted VITE_DEMO_MODE=true" >&2
            exit 1
          fi
