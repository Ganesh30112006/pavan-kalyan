name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests migrations/env.py
      - run: ruff format --check app tests migrations/env.py
      - run: mypy app tests
      - run: pytest
      - name: CLI (stdlib, Python 3.10+)
        run: |
          ruff check ../cli/cloudbridge.py --target-version py310
          mypy --strict ../cli/cloudbridge.py
      - name: AWS deploy script
        run: |
          ruff check ../deploy/aws/deploy.py --line-length 120
          mypy --strict --ignore-missing-imports ../deploy/aws/deploy.py
      - name: Guided setup script (stdlib, Python 3.9+)
        run: |
          ruff check ../frontend/public/cloudbridge-connect.py --target-version py39 --line-length 120
          mypy --strict ../frontend/public/cloudbridge-connect.py

  # Production runs on PostgreSQL: the migrations and the whole suite also run there.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cbtest
          POSTGRES_PASSWORD: cbtest
          POSTGRES_DB: cbtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cbtest" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDBRIDGE_TEST_DATABASE_URL: postgresql+psycopg://cbtest:cbtest@localhost:5432/cbtest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Production bundle contains no demo code
        run: |
          if grep -l "createDemoApi\|demo-conn-aws" dist/assets/*.js; then
            echo "Demo service found in the production bundle" >&2
            exit 1
          fi
      - name: Production build refuses demo mode
        run: |
          if VITE_DEMO_MODE=true npx vite build --outDir /tmp/should-not-exist; then
            echo "Production build accepted VITE_DEMO_MODE=true" >&2
            exit 1
          fi

  # The production images and deploy/compose.yaml: build, start, migrate, sign in through the web container.
  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: |
          cp deploy/cloudbridge.env.example deploy/cloudbridge.env
          docker compose -f deploy/compose.yaml up -d --build --wait
      - name: Smoke test
        run: |
          set -eu
          base=http://localhost:8080
          curl -fsS "$base/api/v1/ready" | grep -q '"status":"ready"'
          curl -fsS -D - -o /dev/null "$base/applications" | grep -qi "content-security-policy"
          docker compose -f deploy/compose.yaml exec -T -e CLOUDBRIDGE_BOOTSTRAP_PASSWORD="ci smoke passphrase 42" api \
            python -m app.cli create-user --email ci@example.com --name CI --role owner --new-organization CI
          curl -fsS -c jar -o /dev/null "$base/api/v1/health"
          csrf=$(awk '$6 == "cb_csrf" {print $7}' jar)
          curl -fsS -o /dev/null -b "cb_csrf=$csrf" -H "X-CSRF-Token: $csrf" -H "Content-Type: application/json" \
            -d '{"email":"ci@example.com","password":"ci smoke passphrase 42"}' "$base/api/v1/auth/login"
          head -c 2000000 /dev/zero | tr '\0' x > big
          test "$(curl -s -o /dev/null -w '%{http_code}' --data-binary @big "$base/api/v1/auth/login")" = 413
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-GitHub-Event: ping' --data-binary @big \
            "$base/api/v1/hooks/github/00000000-0000-0000-0000-000000000000")" = 401
      - name: Logs
        if: always()
        run: docker compose -f deploy/compose.yaml logs --no-color
      - name: Stop
        if: always()
        run: docker compose -f deploy/compose.yaml down -v

  # Continuous deployment: every push to main that passes all of the checks above is deployed to AWS
  # (ECS Express Mode, ap-south-1). GitHub signs in with OIDC; no AWS keys are stored in GitHub.
  # Infrastructure and roles: docs/deployment.md, "AWS (CI/CD)".
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, backend-postgres, frontend, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ap-south-1
      IMAGE_REPOSITORY: 492462083767.dkr.ecr.ap-south-1.amazonaws.com/cloudbridge-app
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::492462083767:role/cloudbridge-github-deploy
          aws-region: ap-south-1
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push the image
        id: image
        run: |
          set -eu
          docker build -f deploy/aws/Dockerfile -t "$IMAGE_REPOSITORY:$GITHUB_SHA" .
          docker push "$IMAGE_REPOSITORY:$GITHUB_SHA"
          echo "pinned=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REPOSITORY:$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install boto3
      - name: Deploy
        id: deploy
        env:
          IMAGE: ${{ steps.image.outputs.pinned }}
        run: python deploy/aws/deploy.py --config deploy/aws/service.json --image "$IMAGE"
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "$URL/api/v1/ready" | grep -q '"status":"ready"'; then
              curl -fsS -o /dev/null "$URL/" && echo "CloudBridge is live at $URL" && exit 0
            fi
            sleep 10
          done
          echo "CloudBridge did not become ready at $URL" >&2
          exit 1
