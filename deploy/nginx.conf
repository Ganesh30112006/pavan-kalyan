# Example production server for the CloudBridge frontend.
# Serves the static build from /srv/cloudbridge/frontend and proxies /api/ to
# FastAPI on the same origin (so cookies stay first-party and CORS is not needed).
# Build with VITE_API_BASE_URL unset (same origin) and VITE_DEMO_MODE unset.

server {
    listen 80;
    server_name cloudbridge.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cloudbridge.example.com;

    ssl_certificate     /etc/ssl/cloudbridge/fullchain.pem;
    ssl_certificate_key /etc/ssl/cloudbridge/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/cloudbridge/frontend;
    index index.html;
    server_tokens off;

    # Security headers (repeated in each location because add_header does not inherit).
    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # Hashed assets never change.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # Source maps are for internal debugging only.
    location ~ \.map$ {
        return 404;
    }

    # Single-page app: unknown paths render index.html, which shows its own 404 page.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }
}
